name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit
      env:
        CI: true

    - name: Run integration tests
      run: npm run test:integration
      env:
        CI: true

    - name: Smoke test - start server and check health
      run: |
        PORT=3000 node server/index.js > server.log 2>&1 &
        SERVER_PID=$!
        echo "Waiting for server (pid $SERVER_PID)..."
        for i in $(seq 1 30); do
          if curl -fs -A "Mozilla/5.0" http://localhost:3000/api/health > /dev/null; then
            echo "Server is up"
            break
          fi
          sleep 1
        done
        curl -fs -A "Mozilla/5.0" http://localhost:3000/api/health
        kill $SERVER_PID || true
