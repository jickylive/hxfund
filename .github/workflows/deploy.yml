name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit
      env:
        CI: true

    - name: Run integration tests
      run: npm run test:integration
      env:
        CI: true

    - name: Smoke test - start server and check health
      run: |
        PORT=3000 node server/index.js > server.log 2>&1 &
        SERVER_PID=$!
        echo "Waiting for server (pid $SERVER_PID)..."
        for i in $(seq 1 30); do
          if curl -fs -A "Mozilla/5.0" http://localhost:3000/api/health > /dev/null; then
            echo "Server is up"
            break
          fi
          sleep 1
        done
        curl -fs -A "Mozilla/5.0" http://localhost:3000/api/health
        kill $SERVER_PID || true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build static frontend
      run: |
        mkdir -p dist
        cp index.html dist/
        cp README.md dist/ 2>/dev/null || true
        # public/ holds the static site assets (css/js/images)
        cp -r public/* dist/
        ls -la dist/

    - name: Verify build
      run: |
        if [ ! -f "dist/index.html" ]; then
          echo "Build failed: index.html not found in dist/"
          exit 1
        fi
        echo "Build verification passed"

    - name: Deploy to Aliyun FTP (www.hxfund.cn)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASS }}
        port: ${{ secrets.FTP_PORT || 21 }}
        local-dir: dist/
        server-dir: /htdocs/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/scripts/**
          **.md
          **.env
        dangerous-clean-slate: false

    - name: Notify deployment
      run: |
        echo "Deployment completed at $(date)"
        echo "Site: https://www.hxfund.cn"
