# hxfund 后端容器化部署（与 lh 生产环境的 compose 保持一致）
# 只含 api + redis；前端已走 FTP 到万网虚拟主机，不再用容器里的 frontend。
# TLS 由 ESA（api.hxfund.cn 直指 lh）与 nginx-proxy 终结，不再需要 api-proxy 服务。
#
# 与 lh 上 /var/local/docker/hxfund/docker-compose.yml 的区别仅两处：
#   - build context：这里是 .（仓库根目录），lh 上是 ../../hxfund
#   - 配置挂载：这里是 ./server/config/.env 与 ./server/config/auth.json，
#     lh 上是 ./config/.env 与 ./config/auth.json（lh 的配置目录是单独的）
# 其余内容（镜像、环境变量、网络、健康检查、内存限制）与 lh 完全一致。
# 改动这里后，记得同步更新 lh 上的那份（或反过来）。

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.cn-shenzhen.aliyuncs.com/jicky/hxfund-api:latest
    container_name: hxfund-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ALLOWED_ORIGINS=https://hxfund.cn,https://www.hxfund.cn,https://api.hxfund.cn
      - REDIS_URL=redis://hxfund-redis:6379
      - VIRTUAL_HOST=api.hxfund.cn
      - LETSENCRYPT_HOST=api.hxfund.cn
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-mail@hxfund.cn}
    volumes:
      - ./logs:/app/logs
      - ./server/config/.env:/app/server/config/.env:ro
      - ./server/config/auth.json:/app/server/config/auth.json:ro
    networks:
      - webproxy
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # 日志轮转：docker 默认 json-file 驱动不限制大小，日志会一直增长；
    # lh 磁盘已用 84%，限制单个容器日志最多 30MB（10m x 3 个文件）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: registry.cn-shenzhen.aliyuncs.com/jicky/redis:latest
    container_name: hxfund-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - webproxy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # 日志轮转：与 api 服务同款，单个容器日志最多 30MB。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  webproxy:
    external: true
    name: webproxy

volumes:
  redis-data:
